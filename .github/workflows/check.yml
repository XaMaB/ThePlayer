name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run bootstrap
      - run: npm run check
  hls-browser:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx playwright install --with-deps chromium
      - run: npm run bootstrap
      - run: npm run build
      - run: npm run fixtures:hls
      - run: npm run test:hls
      - run: npm run test:hls:soak
  hls-metadata-browsers:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    env:
      HLS_TEST_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run bootstrap
      - run: npm run build
      - run: npm run fixtures:hls
      - run: npm run test:hls:packed-audio
      - run: npm run test:hls:metadata
        timeout-minutes: 8
      - run: npm run test:hls:mp3
      - run: npm run test:hls:dolby
      - run: node tests/hls-parts-browser.mjs
        env:
          HLS_PART_SCENARIOS: ll-parts-open,ll-parts-map,ll-parts-encrypted,ll-parts-encrypted-range,ll-parts-gcm-range
      - run: npm run test:hls:dateranges
      - run: npm run test:hls:interstitials
        timeout-minutes: 10
      - run: npm run test:hls:thumbnails
        timeout-minutes: 8
      - run: npm run test:hls:iframes
        timeout-minutes: 8
      - run: npm run test:hls:text
        timeout-minutes: 8
      - run: npm run test:hls:ll-av
        timeout-minutes: 8
      - run: npm run test:hls:cdn
        timeout-minutes: 8
      - run: npm run test:hls:date-preload
        timeout-minutes: 8
        env:
          HLS_DATE_PRELOAD_SCENARIOS: direct,list
