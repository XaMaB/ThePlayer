name: Check
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    timeout-minutes: 15
    # Keep browser/system media libraries aligned with the validated host.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run bootstrap
      - run: npm run check
  hls-browser:
    timeout-minutes: 60
    # Keep browser/system media libraries aligned with the validated host.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg pulseaudio
      - run: npx playwright install --with-deps chromium
      - run: npm run bootstrap
      - run: npm run build
      - run: npm run fixtures:hls
      - run: pulseaudio --start --exit-idle-time=-1 --load=module-null-sink
      - run: npm run test:controls
        env:
          CONTROLS_TEST_BROWSER: chromium
      - run: npm run test:hls
      - run: npm run test:hls:soak
  hls-metadata-browsers:
    # Dependency downloads can consume 25 minutes before browser tests start.
    timeout-minutes: 60
    # Keep browser/system media libraries aligned with the validated host.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    env:
      HLS_TEST_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg pulseaudio
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run bootstrap
      - run: npm run build
      - run: npm run fixtures:hls
      - run: npm run test:hls:packed-audio
      - run: npm run test:hls:metadata
        timeout-minutes: 8
      - run: npm run test:hls:mp3
      - run: npm run test:hls:dolby
      - run: node tests/hls-parts-browser.mjs
        env:
          HLS_PART_SCENARIOS: ll-parts-open,ll-parts-map,ll-parts-encrypted,ll-parts-encrypted-range,ll-parts-gcm-range
      - run: npm run test:hls:dateranges
      - run: npm run test:hls:interstitials
        timeout-minutes: 10
      - run: npm run test:hls:thumbnails
        timeout-minutes: 8
      - run: npm run test:hls:iframes
        timeout-minutes: 8
      - run: npm run test:hls:text
        timeout-minutes: 8
      - run: npm run test:hls:ll-av
        timeout-minutes: 8
      - run: npm run test:hls:cdn
        timeout-minutes: 8
      - run: npm run test:hls:date-preload
        timeout-minutes: 8
        env:
          HLS_DATE_PRELOAD_SCENARIOS: direct,list
      - run: npm run test:hls:video
        timeout-minutes: 8
      - run: node tests/hls-steering-inventory-browser.mjs
        timeout-minutes: 8
      - run: node tests/hls-708-effects-browser.mjs
        timeout-minutes: 8
      - run: node tests/hls-steering-topology-browser.mjs
        timeout-minutes: 8
      - run: npm run test:hls:sei
        timeout-minutes: 8
      - run: pulseaudio --start --exit-idle-time=-1 --load=module-null-sink
      - run: npm run test:hls:he-aac
        timeout-minutes: 8
      - run: npm run test:hls:live-range
        timeout-minutes: 3
      - run: npm run test:hls:switch-wait
        timeout-minutes: 3
      - run: npm run test:hls:native-clock
        timeout-minutes: 3

  dash-browsers:
    timeout-minutes: 60
    # Keep browser/system media libraries aligned with the validated host.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      DASH_TEST_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg pulseaudio
      - run: npx playwright install --with-deps chromium ${{ matrix.browser }}
      - run: npm run bootstrap
      - run: npm run build
      - run: npm run fixtures:dash
      - run: pulseaudio --start --exit-idle-time=-1 --load=module-null-sink
      - run: npm run test:dash
        timeout-minutes: 25
      - run: npm run fixtures:hls && npm run test:managed-media && npm run test:controls
        if: matrix.browser == 'webkit'
        timeout-minutes: 5
      - run: npm run fixtures:hls && npm run test:abr:policy
        if: matrix.browser == 'chromium' || matrix.browser == 'webkit'
        timeout-minutes: 10
        env:
          ABR_TEST_BROWSER: ${{ matrix.browser }}
      - run: npm run test:controls:extras
        if: matrix.browser == 'webkit'
        timeout-minutes: 4
      - run: npm run test:pip:fallback && xvfb-run -a npm run test:pip
        if: matrix.browser == 'webkit'
        timeout-minutes: 4
      - run: npm run test:demo:drm
        if: matrix.browser == 'chromium'
        timeout-minutes: 3
      - run: npm run test:dash:drm
        if: matrix.browser == 'chromium'
      - run: npm run test:dash:soak
        if: matrix.browser == 'chromium'
        timeout-minutes: 5
        env:
          DASH_SOAK_SECONDS: 180
